name: Native Windows CUDA build
on:
  push:
    branches: [main]
    paths: ['Native/**', 'src/**', 'assets/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['Native/**', 'src/**', 'assets/**', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA compiler and runtime
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '13.2.0'
          method: network
          sub-packages: '["nvcc", "cudart"]'
      - name: Build native application (forward-compatible PTX)
        shell: pwsh
        run: ./Native/build.ps1 -Architecture compute_75
      - name: Upload runnable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ClearwaterNative-Windows-x64
          path: Native/build/
          if-no-files-found: error
